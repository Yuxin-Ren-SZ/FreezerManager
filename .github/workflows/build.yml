name: Build

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel superseded runs on the same ref: every push to a PR otherwise relaunches
# the whole C++ matrix. Exception: never cancel runs on main. Re-running failed
# jobs (or any overlapping run) on main shares this ref-keyed group, and
# cancel-in-progress would abort the in-flight re-run — the slow dev/asan/tsan
# jobs get CANCELLED while the fast jobs finish. Keep PR-push cancellation (the
# runner-minute saver) but protect main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides what the change can affect (#56). A PR that touches only the SPA,
  # docs or issue templates skips the C++ matrix and clang-tidy. The jobs are
  # gated with job-level `if:`, so they report "skipped", which counts as passing
  # (a workflow-level `paths-ignore` would leave required checks pending instead).
  # Pushes to main always run everything.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cpp: ${{ steps.classify.outputs.cpp }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull_request the checkout is GitHub's merge commit, whose first
          # parent is the base branch tip; depth 2 makes HEAD^1 available.
          fetch-depth: 2

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "cpp=true (not a pull request)"
            echo "cpp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf 'Changed files:\n%s\n' "$changed"
          cpp=false
          reason="only docs, web and issue-template files changed"
          while IFS= read -r path; do
            case "$path" in
              "") ;;
              # Part of the CMake tree, although the SPA itself is not.
              src/web/CMakeLists.txt) cpp=true; reason="$path"; break ;;
              src/web/* | doc/* | .github/ISSUE_TEMPLATE/* | *.md | .nvmrc) ;;
              *) cpp=true; reason="$path"; break ;;
            esac
          done <<<"$changed"
          if [ -z "$changed" ]; then
            cpp=true
            reason="empty diff"
          fi
          echo "cpp=$cpp ($reason)"
          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"

      # The Release jobs only build; tests run in the Debug presets. One Release
      # build per PR is enough to catch a Release-only break, so PRs skip
      # clang-17 release. Pushes to main build all seven.
      - name: Select the C++ build matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          matrix='[
            {"compiler": "gcc-13", "cc": "gcc-13", "cxx": "g++-13", "preset": "dev", "build_type": "Debug"},
            {"compiler": "gcc-13", "cc": "gcc-13", "cxx": "g++-13", "preset": "release", "build_type": "Release"},
            {"compiler": "clang-17", "cc": "clang-17", "cxx": "clang++-17", "preset": "dev", "build_type": "Debug"},
            {"compiler": "clang-17", "cc": "clang-17", "cxx": "clang++-17", "preset": "release", "build_type": "Release"},
            {"compiler": "clang-17", "cc": "clang-17", "cxx": "clang++-17", "preset": "asan", "build_type": "Debug"},
            {"compiler": "clang-17", "cc": "clang-17", "cxx": "clang++-17", "preset": "ubsan", "build_type": "Debug"},
            {"compiler": "clang-17", "cc": "clang-17", "cxx": "clang++-17", "preset": "tsan", "build_type": "Debug"}
          ]'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            filter='map(select(.compiler != "clang-17" or .preset != "release"))'
          else
            filter='.'
          fi
          selected="$(jq -c "{include: ($filter)}" <<<"$matrix")"
          echo "matrix=$selected"
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"

  # SPDX and formatting need neither Conan nor a build, so they report in about
  # a minute instead of after the C++ tests (and still run when a test fails).
  lint:
    name: lint (SPDX, clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17

      - name: Check SPDX headers
        run: tools/check-spdx-headers.sh

      - name: Check formatting
        run: >
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.ipp' '*.proto'
          | xargs -0 --no-run-if-empty clang-format-17 --dry-run --Werror

  build:
    name: ${{ matrix.compiler }} ${{ matrix.preset }}
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    # Backstop against a hung/OOM/deadlocked build (tsan especially) running to
    # GitHub's 6h default and burning runner minutes. It must still exceed a
    # cold-cache run, where "Install dependencies" builds gRPC/protobuf/abseil/
    # drogon from source (~50 min) before our own build starts. The Conan cache
    # is saved right after that install, so a later timeout no longer loses it.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fmgr_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        # -U/-d so the health probe authenticates as the real role/db instead of
        # the container's root OS user, which floods the log with
        # 'FATAL: role "root" does not exist' every interval.
        options: >-
          --health-cmd "pg_isready -U postgres -d fmgr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The Conan build of gRPC/abseil/protobuf plus a full (Debug) build tree
      # can exceed the ~14 GB free on a hosted runner, crashing the runner with
      # "No space left on device". Reclaim ~20+ GB of preinstalled toolchains we
      # never use before building. Best-effort: never fail the job on cleanup.
      - name: Free up disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-17 \
            cmake \
            g++-13 \
            gcc-13 \
            gcovr \
            ninja-build \
            pipx
          pipx install conan
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Conan dependencies
        uses: ./.github/actions/conan-deps
        with:
          build-type: ${{ matrix.build_type }}
          preset: ${{ matrix.preset }}

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        # Cap parallelism to 2. The Debug presets statically link several
        # gRPC-heavy integration-test executables; linking them all at the
        # default width (~cores+2) peaks past the runner's 16 GB RAM and the
        # OOM killer takes down the job (ninja "interrupted by user", exit 143).
        # Conan deps are prebuilt/cached, so this only paces our own tree.
        run: cmake --build --preset ${{ matrix.preset }} -j 2

      - name: Test
        if: ${{ matrix.preset == 'dev' || matrix.preset == 'asan' || matrix.preset == 'ubsan' || matrix.preset == 'tsan' }}
        env:
          FMGR_TEST_POSTGRES_URL: postgresql://postgres:test@localhost:5432/fmgr_test
        # The gRPC server integration and e2e tests are excluded under asan/tsan:
        # Conan's gRPC/absl are built without sanitizers, so they emit
        # library-internal false positives across the instrumentation boundary
        # (e.g. abseil any_invocable / status-payload, gRPC epoll/combiner
        # threads during server shutdown). Both labels spin a real gRPC server.
        # Our own code stays covered under sanitizers by the unit tests.
        run: >
          ctest --preset ${{ matrix.preset }} --output-on-failure
          ${{ (matrix.preset == 'asan' || matrix.preset == 'tsan') && '--label-exclude "grpc_integration|e2e"' || '' }}

      - name: Coverage tooling
        if: ${{ matrix.preset == 'dev' }}
        continue-on-error: true
        run: gcovr --version

  # clang-tidy runs once, here, rather than in both dev jobs (#56). It needs the
  # compile DB and the protoc output, not a full build, so it runs alongside the
  # matrix instead of after a build and the tests.
  #
  # Results are cached with ctcache (https://github.com/matus-chochlik/ctcache),
  # pinned by commit and checksum. ctcache hashes each translation unit's
  # preprocessed text (so a changed header invalidates every file that includes
  # it) together with the clang-tidy config dumped for that file, and it stores
  # only clean results, so a file with findings is re-checked on every run.
  # Parallelism stays at -j 2 (doc/dev/clang-tidy.md); the cache is what makes
  # this fast.
  clang-tidy:
    name: clang-tidy
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CTCACHE_COMMIT: 857b14271d3ded5511c2e6a60f2dc20c1e4b5680
      CTCACHE_SHA256: 65b86482ec7574528889ea60f3ce9388e0da562ecc27cdefa4343bc220360884
      # Hash comments too. Otherwise deleting a NOLINT from a clean file would
      # leave its preprocessed text unchanged and replay a stale "clean".
      CTCACHE_KEEP_COMMENTS: "1"
      # Conan gives every package build a fresh folder name
      # (~/.conan2/p/b/grpc<16 hex>/p), and that path appears in the -isystem
      # flags and in the preprocessor's line markers. Strip that segment (a
      # regex, applied to flags and, with STRIP_SRC, to the preprocessed text), so
      # a rebuilt but identical dependency does not invalidate every result.
      # Header content still counts: a changed header changes the hash.
      CTCACHE_STRIP: '/\.conan2/p/(b/)?[^/\s"]+/p/'
      CTCACHE_STRIP_SRC: "1"
    steps:
      - uses: actions/checkout@v4

      # A cold Conan cache builds gRPC/protobuf/abseil here too; see the build
      # job for why the runner needs the extra space.
      - name: Free up disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-17 \
            clang-tidy-17 \
            cmake \
            ninja-build \
            pipx
          pipx install conan
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Conan dependencies
        uses: ./.github/actions/conan-deps
        with:
          build-type: Debug
          preset: dev

      - name: Configure CMake
        env:
          CC: clang-17
          CXX: clang++-17
        run: cmake --preset dev

      # Every TU that includes an API type needs the generated fmgr/v1/*.pb.h.
      - name: Generate protobuf sources
        run: cmake --build --preset dev --target freezermanager_proto -j 2

      - name: Set up ctcache
        id: ctcache
        run: |
          bin="$RUNNER_TEMP/ctcache-bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$bin/clang_tidy_cache.py" \
            "https://raw.githubusercontent.com/matus-chochlik/ctcache/$CTCACHE_COMMIT/src/ctcache/clang_tidy_cache.py"
          echo "$CTCACHE_SHA256  $bin/clang_tidy_cache.py" | sha256sum --check -
          tidy="$(command -v clang-tidy-17)"
          printf '#!/bin/sh\nexec python3 "%s" "%s" "$@"\n' "$bin/clang_tidy_cache.py" "$tidy" > "$bin/clang-tidy"
          chmod +x "$bin/clang-tidy"
          echo "CTCACHE_DIR=$RUNNER_TEMP/ctcache" >> "$GITHUB_ENV"
          # Part of the cache key: a different clang-tidy may report differently
          # on unchanged code, so it starts from an empty cache.
          echo "tidy-version=$("$tidy" --version | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # The entries are a few bytes per clean TU, so every run saves one (PRs
      # included) and restores the newest for its clang-tidy version.
      - name: Restore clang-tidy result cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ctcache
          key: ctcache-${{ runner.os }}-${{ steps.ctcache.outputs.tidy-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ctcache-${{ runner.os }}-${{ steps.ctcache.outputs.tidy-version }}-

      - name: Run clang-tidy
        # run-clang-tidy (ships with LLVM) lints every TU in compile_commands.json;
        # only our sources are in the compile DB (Conan deps are prebuilt). The
        # trailing regex (Python re.search, negative lookahead) excludes the
        # protoc/grpc-generated .pb.cc / .grpc.pb.cc translation units, which are
        # not ours to lint. Never above -j 2: each clang-tidy process can use
        # 2–4 GB with the full check set, and the runner has 16 GB.
        run: >
          run-clang-tidy-17 -p out/build/dev -j 2 -quiet
          -clang-tidy-binary "$RUNNER_TEMP/ctcache-bin/clang-tidy"
          '^(?!.*proto_generated).*$'

      - name: clang-tidy cache statistics
        if: success() || failure()
        run: python3 "$RUNNER_TEMP/ctcache-bin/clang_tidy_cache.py" --show-stats

      # Saved after a failed run too: the clean results it did produce are valid.
      - name: Save clang-tidy result cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ctcache
          key: ctcache-${{ runner.os }}-${{ steps.ctcache.outputs.tidy-version }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The SPA in src/web (TODO.md G1.1) is independent of the C++ matrix: it needs
  # Node, not Conan, and finishes in about a minute. A separate job means a web
  # failure is reported in minutes instead of hiding behind a 120-minute
  # sanitizer build, and a C++ failure never blocks the web signal.
  web:
    name: web (node from .nvmrc)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      # `npm ci` is the only supported install (G-arch 2): it uses the committed
      # src/web/package-lock.json and fails if it disagrees with package.json.
      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      # npm run check = gen + lint + typecheck + format:check + test + build,
      # where build enforces the 250 KiB gzipped initial-JS budget.
      - name: Check
        working-directory: src/web
        run: npm run check

      # Cheap, and it proves the web extensions of the check (G1.1).
      - name: Check SPDX headers
        run: tools/check-spdx-headers.sh
